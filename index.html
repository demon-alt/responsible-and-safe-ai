<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsible AI Quiz - Premium Edition</title>
<style>
:root{--primary:#444;--accent:#6200ee;--success:#00c853;--danger:#d50000;--bg:#f8f9fa;--surface:#fff;--card-border:#e0e0e0;--text-main:#202124;--option-bg:#f1f3f4;--option-hover:#e8eaed;--header-bg:rgba(255,255,255,.95)}
body.dark-mode{--primary:#e0e0e0;--accent:#bb86fc;--bg:#0a0a0a;--surface:#1e1e1e;--card-border:#333;--text-main:#fff;--option-bg:#252525;--option-hover:#2d2d2d;--header-bg:rgba(18,18,18,.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text-main);margin:0;transition:background .3s;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.header{width:100%;max-width:600px;position:sticky;top:0;background:var(--header-bg);backdrop-filter:blur(10px);padding:15px;z-index:100;border-bottom:1px solid var(--card-border)}
.selector-container{position:relative;margin-bottom:5px}
select{width:100%;padding:12px 15px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--text-main);font-size:15px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none;outline:none}
.selector-container::after{content:'▼';position:absolute;right:15px;top:20px;color:var(--accent);pointer-events:none;font-size:12px}
.stats-bar{display:flex;justify-content:space-between;font-size:11px;margin-top:10px;color:var(--accent);text-transform:uppercase;font-weight:bold}
#quiz-wrapper{width:100%;max-width:600px;padding:20px;flex-grow:1}
.quiz-card{background:var(--surface);border-radius:24px;padding:25px;border:1px solid var(--card-border);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.q-text{font-size:18px;line-height:1.4;margin-bottom:10px;font-weight:600}
.q-hint{font-size:12px;color:var(--accent);font-weight:bold;margin-bottom:14px;text-transform:uppercase}
.option-label{display:flex;align-items:center;padding:15px;margin:10px 0;background:var(--option-bg);border:2px solid transparent;border-radius:12px;cursor:pointer;transition:.2s}
.option-label:hover{background:var(--option-hover)}
.option-label.selected{border-color:var(--accent);background:rgba(98,0,238,.1)}
.option-label.right{border-color:var(--success)}
.option-label.wrong{border-color:var(--danger)}
.option-label input{margin-right:15px;accent-color:var(--accent);scale:1.2;flex-shrink:0}
.num-input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--accent);background:var(--option-bg);color:var(--text-main);font-size:18px;outline:none}
.feedback-area{margin-top:20px;padding:15px;border-radius:12px;display:none;font-size:14px;line-height:1.5}
.feedback-correct{background:rgba(0,200,83,.1);border:1px solid var(--success)}
.feedback-wrong{background:rgba(213,0,0,.1);border:1px solid var(--danger)}
.description-box{margin-top:10px;color:var(--primary);border-top:1px solid var(--card-border);padding-top:10px;font-style:italic}
.controls{margin-top:25px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:800;text-transform:uppercase;cursor:pointer;letter-spacing:1px}
.btn-submit{background:var(--accent);color:#fff;box-shadow:0 4px 15px rgba(98,0,238,.3)}
.btn-submit:disabled{background:#ccc;color:#777;box-shadow:none;cursor:not-allowed}
.btn-next{background:var(--text-main);color:var(--surface)}
.progress-container{width:100%;background:var(--option-bg);height:8px;border-radius:4px;margin-top:15px;overflow:hidden}
#progress-bar{width:0;height:100%;background:var(--accent);transition:.5s ease}
#review-panel{width:100%;max-width:600px;padding:20px 20px 90px}
.log-card{background:var(--surface);border:1px solid var(--card-border);border-left:5px solid var(--danger);padding:15px;margin-bottom:10px;border-radius:15px;cursor:pointer;font-size:14px}
.log-details{display:none;margin-top:10px;font-size:13px;border-top:1px solid var(--card-border);padding-top:10px}
.jump{background:var(--accent);color:#fff;padding:3px 8px;border-radius:4px;font-size:10px;float:right;margin-left:8px}
.theme-toggle{position:fixed;bottom:25px;right:25px;width:55px;height:55px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;z-index:1000;font-size:24px;box-shadow:0 5px 15px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body class="dark-mode">
<div class="header">
  <div class="selector-container"><select id="week-selector" onchange="initQuiz()"></select></div>
  <p style="font-size:14px;color:#888;margin:8px 0 0">AASHA KRTA HU APKA NPTEL ASAFAL RAHE! Thank Your for Visiting!</p>
  <div class="progress-container"><div id="progress-bar"></div></div>
  <div class="stats-bar"><span>SCORE: <span id="current-score">0</span></span><span>PROGRESS: <span id="q-count">0/0</span></span></div>
</div>

<div id="quiz-wrapper">
  <div id="quiz-container" class="quiz-card"></div>
  <div class="controls" id="controls">
    <button id="submit-btn" class="btn btn-submit" onclick="checkAnswer()" disabled>Submit Answer</button>
    <button id="next-btn" class="btn btn-next" onclick="nextQuestion()" style="display:none">Next Question</button>
  </div>
</div>

<div id="review-panel">
  <h3 style="color:var(--danger);font-size:14px;letter-spacing:2px">ERROR LOG</h3>
  <div id="wrong-log"></div>
  <button class="btn" style="background:transparent;color:var(--danger);border:1px solid var(--danger);margin-top:20px;font-size:11px" onclick="clearData()">Reset History</button>
</div>

<button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️</button>

<script>
/* Data format per week: {week, title, questions:[{id, type:'single'|'multiple'|'numeric', question, options, answer, explanation}]} */
const DATA = {"1": {"week": 1, "title": "AI Risk", "questions": [{"id": 1, "type": "single", "question": "What does the “Systemic Safety” strategy in the Disaster Risk Equation primarily aim to achieve?", "options": ["Improve a specific model’s ability to withstand external hazards", "Identify and avoid hazards through real-time monitoring", "Reduce the likelihood of conflict and overall systemic risks in the environment", "Align an agent’s goals with human values"], "answer": 2, "explanation": "AI Risk Part 3 [34:02-34:55] - Looking at the risk equation as “systemic” safety can generally reduce the risks."}, {"id": 2, "type": "single", "question": "In the context of “Deceptive Alignment,” what is the primary concern regarding model behavior?", "options": ["The model appears to follow safety guidelines during training but pursues different goals after deployment", "The model cannot understand human language due to environmental differences", "The model accidentally deletes critical memory during deployment", "The model’s safeguards are easily bypassed by simple user prompts"], "answer": 0, "explanation": "AI Risk Part 4 [23:34-24:23] - The model appears to behave a specific way (e.g. grab the ball) but later doesn’t."}, {"id": 3, "type": "single", "question": "According to the lecture, why is “proxy gaming” considered a failure mode in AI systems?", "options": ["Agents over-optimize faulty metrics, producing outcomes misaligned with true human values", "AI systems consume excessive computational resources unnecessarily", "AI systems are used to cheat in video games", "It results from hardware failure during large-scale simulations"], "answer": 0, "explanation": "AI Risk Part 4 [20:26-22:17] - Future agents could over-optimize and game faulty proxies, creating a world distinct from what humans value."}, {"id": 4, "type": "single", "question": "According to the lecture, why might AI systems develop an “instrumental incentive” to seek power?", "options": ["They are explicitly programmed to dominate humans", "Power and resources help them pursue their goals more effectively", "It is a biological byproduct of the neural network design", "They imitate human power-seeking behavior from training data"], "answer": 1, "explanation": "AI Risk Part 4 [9:51-11:50] - Suitably strategic and intelligent agents will have instrumental incentives to gain and maintain power, since power helps pursue their objectives more effectively."}, {"id": 5, "type": "single", "question": "What does the term “Treacherous Turns” refer to in AI safety?", "options": ["Failures caused by biased training data", "A system behaving differently once sufficiently capable", "Intentional misuse of AI by malicious humans", "Over-optimization of proxy objectives"], "answer": 1, "explanation": "AI Risk Part 4 [22:18-23:34] - AI could behave differently once it has the ability to do so."}, {"id": 6, "type": "single", "question": "According to the “Swiss cheese model”, which statement best describes effective safety design?", "options": ["Rely on a single, highly robust safety mechanism", "Implement safety measures randomly across the system", "Use multiple layers of defense so that individual weaknesses are compensated by others", "Eliminate safety measures if the AI system is well-designed"], "answer": 2, "explanation": "AI Risk Part 3 [8:18-10:48] - Multiple layers of defense compensate for each other’s individual weaknesses, leading to a low overall level of risk."}, {"id": 7, "type": "multiple", "question": "According to the lecture, what are the potential “double-edged sword” risks associated with AI in military applications? (Select all that apply.)", "options": ["Autonomous weapons targeting humans with high precision", "Complete elimination of the need for human strategic decision-making", "Lowering the barriers to large-scale violence", "Autonomous retaliation systems increasing the risk of rapid escalation"], "answer": [0, 2, 3], "explanation": "AI Risk Part 3 [1:02-2:55] - Low-cost automated weapons such as drone swarms can hunt human targets with high precision, lowering barriers to large-scale violence; automated retaliation risks rapid escalation. (Multi-select answer inferred from the explanation.)"}, {"id": 8, "type": "multiple", "question": "Which of the following are considered speculative hazards of AI? (Select all that apply.)", "options": ["Eroded Epistemics", "Enfeeblement", "Deceptive Alignment", "Hardware Degradation"], "answer": [0, 1, 2], "explanation": "Slide 146 in the week’s lecture notes lists speculative hazards and failure modes. (Answer inferred.)"}, {"id": 9, "type": "multiple", "question": "The Disaster Risk Equation can be mitigated by (Select all that apply.):", "options": ["Improving agents’ robustness to withstand hazards", "Identifying and mitigating hazards before they cause harm", "Increasing the number of parameters to drown out errors", "Reducing the severity of inherent model vulnerabilities"], "answer": [0, 1, 3], "explanation": "AI Risk Part 3 [29:45-34:02] - Vulnerability: robustness; Hazard exposure: monitoring; Hazard: alignment. (Answer inferred.)"}, {"id": 10, "type": "single", "question": "Which risk refers to humans voluntarily ceding control of socio-economic functions to AI to keep up with the automated world?", "options": ["Eroded Epistemics", "Deceptive Alignment", "Proxy Gaming", "Enfeeblement"], "answer": 3, "explanation": "AI Risk Part 3 [2:57-3:44] - As AIs automate more tasks, this could lead to human enfeeblement and dependence on AIs for basic needs."}, {"id": 11, "type": "single", "question": "In the risk decomposition framework, which combination of factors would result in the HIGHEST risk from an AI system?", "options": ["High vulnerability, high hazard exposure, high hazard severity.", "Low vulnerability, high hazard exposure, low hazard severity.", "Low vulnerability, low hazard exposure, high hazard severity.", "High vulnerability, low hazard exposure, high hazard severity."], "answer": 0, "explanation": "Slide 107 - Risk is a multiplicative equation; increasing any factor increases overall risk."}, {"id": 12, "type": "single", "question": "According to the lecture, which of the following about the AI race is true?", "options": ["AI systems naturally become safer as they grow more powerful.", "The AI race reduces the need for regulation and monitoring.", "It ensures faster AI development that guarantees equal benefits for all nations.", "AI competition may push to speed up development while giving up oversight."], "answer": 3, "explanation": "AI Risk Part 3 [0:20-1:01] - Competition could push nations and corporations to rush AI development, relinquishing control to these systems."}]}, "2": {"week": 2, "title": "Robustness & RLHF", "questions": [{"id": 1, "type": "single", "question": "What are “Black Swans”?", "options": ["Frequent events with predictable and minor impacts.", "Outlier events that often have extreme and unpredictable impacts.", "Known risks that are intentionally ignored during model training.", "Events that follow a thin-tailed distribution and have negligible consequences."], "answer": 1, "explanation": "Robustness Part 1 [3:36-5:12] - Black swans are outliers, lying outside typical expectations, and often carry extreme impact."}, {"id": 2, "type": "multiple", "question": "Which of the following is considered a “Known Unknown”? (Select all that apply.)", "options": ["Recollection", "Closed-ended Questions", "Meta-ignorance", "Conscious Ignorance", "Open-ended Exploration", "Self-analysis"], "answer": [1, 3], "explanation": "Robustness Part 1 [19:20-22:05] - Known Unknowns are things we are aware of but don’t understand, such as conscious ignorance or closed-ended questions."}, {"id": 3, "type": "single", "question": "Which type of distribution shift occurs when the input distribution P(x) changes between training and testing but P(y|x) remains constant?", "options": ["Concept shift", "Normalized shift", "Covariate shift", "Prior probability shift"], "answer": 2, "explanation": "Robustness Part 2 [23:00-24:53] - P(x) changes between train and test but P(y|x) does not in covariate shift."}, {"id": 4, "type": "single", "question": "What is “transferability” in the context of adversarial attacks?", "options": ["The ability to move a model from a secure state to a vulnerable state.", "The phenomenon where adversarial examples crafted for one model also fool another model.", "Converting a black-box model into a white-box model.", "The process of retraining a model on adversarial attacks."], "answer": 1, "explanation": "Lecture 8 and 9 Notes (Slide 70) - Adversarial examples crafted for one model can be used to attack other models."}, {"id": 5, "type": "single", "question": "According to the lecture, what is a common trade-off when using Adversarial Training to improve robustness?", "options": ["It requires a significantly larger dataset than normal training.", "It can significantly reduce the accuracy on clean examples.", "It only works for simple binary classifiers.", "It requires a low-variance dataset to function effectively."], "answer": 1, "explanation": "Lecture 8 and 9 Notes (Slide 78) - Adversarial training can reduce accuracy on clean examples by 10%+."}, {"id": 6, "type": "multiple", "question": "Which of the following are challenges associated with direct human ratings when modeling preferences? (Select all that apply.)", "options": ["Human-in-the-loop evaluation is expensive and time-consuming.", "Direct ratings require white-box access to the model.", "Human ratings are always completely objective and free from annotator bias.", "Human judgments are noisy and miscalibrated."], "answer": [0, 3], "explanation": "RLHF [8:39-13:31] - Two problems: human-in-the-loop is expensive, and human judgments are noisy and miscalibrated."}, {"id": 7, "type": "single", "question": "What does Direct Preference Optimization (DPO) represent in the RLHF framework?", "options": ["RLHF without the reward model", "RLHF without human feedback", "RLHF without reinforcement learning", "RLHF without policy optimization"], "answer": 0, "explanation": "AI Alignment [4:54-6:35] - RLHF – Reward model = DPO."}, {"id": 8, "type": "single", "question": "What is the first step of the RLHF pipeline?", "options": ["Collecting comparison data and training a reward model.", "Optimizing a policy against the reward model using reinforcement learning.", "Collecting demonstration data and training a supervised policy.", "Performing external white-box auditing of the pretrained model."], "answer": 2, "explanation": "RLHF [3:57-6:38] - The first step is to collect demonstration data and train a supervised model."}, {"id": 9, "type": "single", "question": "Why is black-box access insufficient for rigorous AI audits?", "options": ["It is too expensive for external auditors.", "It does not allow for human-in-the-loop feedback.", "It prevents the use of reinforcement learning.", "It only allows auditors to query the system and observe outputs."], "answer": 3, "explanation": "AI Alignment [24:28-25:13] - Auditors can only query the system and observe its output."}, {"id": 10, "type": "single", "question": "According to the lecture, what does the Kullback–Leibler (KL) divergence penalty prevent in RLHF?", "options": ["The reward model from becoming too complex", "The policy model from diverging too far from the initial pretrained model", "Human evaluators from providing biased feedback", "The model from over-generalizing"], "answer": 1, "explanation": "RLHF [14:31-16:35] - The KL divergence penalty prevents diverging too far from the pretrained model."}, {"id": 11, "type": "multiple", "question": "Which of the following is true? (Select all that apply.)", "options": ["Extremistan has thin tails while Medicristan has long tails.", "Extremistan is determined by many small events.", "Mediocristan is the tyranny of the collective.", "Extremistan’s impact is potentially scalable."], "answer": [2, 3], "explanation": "Robustness Part 1 [17:22-19:19] (answer inferred; the PDF gives only the timestamp)."}, {"id": 12, "type": "multiple", "question": "Identify the equations that can lead to a long-tailed distribution.", "options": ["Idea * student * resources * time", "Idea * student + resources * time", "Idea + student + resource + time", "Idea - student * resource - time"], "answer": [0], "explanation": "Robustness Part 1 [15:17-17:21] - Research output = Ideas × Time × Students × Resources."}]}, "3": {"week": 3, "title": "Machine Unlearning", "questions": [{"id": 1, "type": "single", "question": "Match the unlearning method to their corresponding concept. 1) Exact unlearning 2) Unlearning via Differential Privacy 3) Example Unlearning 4) Concept Unlearning. i) Unlearned model and retrained model are distributionally close; ii) The forget set is clearly defined; iii) The forget set is not clearly defined; iv) Unlearned model and retrained model are distributionally identical.", "options": ["1 -> i, 2 -> iv, 3 -> iii, 4 -> ii", "1 -> i, 2 -> iv, 3 -> ii, 4 -> iii", "1 -> iv, 2 -> i, 3 -> iii, 4 -> ii", "1 -> iv, 2 -> i, 3 -> ii, 4 -> iii"], "answer": 3, "explanation": "Exact unlearning: distributionally identical. DP unlearning: distributionally close. Example unlearning: train/retain/forget sets clearly defined. Concept unlearning: sets poorly specified or not specified."}, {"id": 2, "type": "single", "question": "What is the primary goal of “Machine Unlearning”?", "options": ["To increase the training speed of a model.", "To add more data to an existing model without retraining.", "To remove the influence of specific training data from a trained model.", "To improve the accuracy of a model on new, unseen data."], "answer": 2, "explanation": "Unlearning [8:41-9:36] - Removing the influences of training data from a trained model."}, {"id": 3, "type": "single", "question": "What is GDPR’s Article 17 about in the context of Machine Learning?", "options": ["Right to be remembered", "Right to be forgotten", "Right to be modified", "Right to be distributed"], "answer": 1, "explanation": "Unlearning [11:35-15:50] - Article 17 is the right to erasure / right to be forgotten."}, {"id": 4, "type": "single", "question": "In the SISA framework, what is the benefit of using “shards” and “slices”?", "options": ["It increases the overall accuracy of the model.", "It ensures that unlearned data never contributes to other components.", "It allows the model to learn from toxic data safely.", "It eliminates the need for any retraining."], "answer": 1, "explanation": "Unlearning [29:44-30:02] - By design, unlearned data never contributed to other components (split)."}, {"id": 5, "type": "single", "question": "What is “Membership Inference Attack”?", "options": ["To distinguish whether specific training data was used to train a model.", "To add new members to a training dataset.", "To speed up the unlearning process.", "To verify the architecture of the model."], "answer": 0, "explanation": "Approximate Unlearning [11:55-13:48] - Membership inference attacks aim to distinguish training data from unseen data."}, {"id": 6, "type": "single", "question": "Which unlearning method involves increasing the training loss on the forget set?", "options": ["KL Divergence", "Direct Preference Optimization", "Gradient Ascent", "Gradient Difference"], "answer": 2, "explanation": "Evaluation of Unlearning and Graph Unlearning Part 1 [17:20-19:08] - Gradient Ascent messes up predictions on the forget set by increasing the usual training loss."}, {"id": 7, "type": "single", "question": "According to the lecture, what is “Representation Engineering”?", "options": ["A bottom-up approach focusing on individual neurons.", "Modifying representation vectors to control model traits.", "A method for increasing the parameter count of a model.", "Re-labeling all data points in a dataset to fix biases."], "answer": 1, "explanation": "Evaluation of Unlearning and Graph Unlearning Part 1 [30:35-33:10] - Modify the representation vectors to modify the model outputs."}, {"id": 8, "type": "single", "question": "In the context of the SISA framework, how does the system minimize the cost of retraining when a data point must be unlearned?", "options": ["By using gradient ascent on only the affected data points.", "By applying a differential privacy constraint to the aggregation layer.", "By flipping the labels of the forget set and performing few-shot.", "By retraining only the constituent model whose shards contain the point to be unlearned."], "answer": 3, "explanation": "Unlearning [25:00-29:43] - Only the constituent model whose shard contains the point is retrained, starting from the last saved parameters before the slice containing that point."}, {"id": 9, "type": "single", "question": "According to the lecture, why is unlearning fundamental facts like “the sun rises every day” considered more difficult than unlearning infrequent textual occurrences, such as car accidents?", "options": ["Fundamental knowledge is deeply embedded in the model’s implicit knowledge graph.", "Fundamental facts are typically protected by guardrails.", "Models are primarily trained on Wikipedia, which contains these facts.", "Differential privacy guarantees fall off more quickly for fundamental facts."], "answer": 0, "explanation": "Evaluation of Unlearning and Graph Unlearning Part 1 [25:25-27:16] - Such knowledge cannot be unlearned without introducing contradictions and harming utility."}, {"id": 10, "type": "single", "question": "Which unlearning evaluation metric focuses on whether the unlearning process negatively affects the model’s performance on the “retrain data” or unrelated tasks?", "options": ["Efficiency", "Forgetting Quality", "Model Utility", "Membership Inference"], "answer": 2, "explanation": "Approximate Unlearning [25:55-27:35] - Model utility: do we harm performance on the retain data or orthogonal tasks?"}, {"id": 11, "type": "multiple", "question": "The WMDP benchmark measures hazardous knowledge in which specific areas? (Select all that apply.)", "options": ["Biosecurity/Bioweapons", "Cybersecurity", "Chemical security", "Financial market manipulation"], "answer": [0, 1, 2], "explanation": "Evaluation of Unlearning and Graph Unlearning Part 1 [19:45-21:40] - Biosecurity, cybersecurity and chemical security."}, {"id": 12, "type": "multiple", "question": "Which methods are used for Edge Unlearning? (Select all that apply.)", "options": ["GraphEraser", "GUIDE", "Projector", "GraphEditor", "GNNDelete", "MEGU"], "answer": [3, 4, 5], "explanation": "Graph Unlearning Part 2 [13:14-16:53] - The answer is read from a chart not included in the PDF text. This answer is inferred, so verify it against the lecture chart."}]}, "4": {"week": 4, "title": "Bias I", "questions": [{"id": 1, "type": "single", "question": "How does the definition of “bias” in CS/ML differ from Statistics?", "options": ["Statistics focuses on societal values, while CS/ML focuses on mathematical deviations.", "Statistics defines it as a systematic error in data collection/interpretation, while CS/ML defines it as a systematic favoritism towards certain groups/outcomes.", "CS/ML focuses on rationality in judgment, while Statistics focuses on algorithmic performance.", "There is no difference; both define bias as a systematic deviation from rationality."], "answer": 1, "explanation": "Bias - I [18:48-19:41] - Statistics: systematic error in the collection, analysis, or interpretation of data. CS/ML: systematic favoritism or discrimination towards certain groups/outcomes."}, {"id": 2, "type": "single", "question": "According to the slides, when does bias become a problem?", "options": ["Bias is a problem at all times because humans are not perfect.", "It is only a problem when it occurs in the data collection phase.", "It is only a problem when it can have a negative impact.", "It is only a problem when the model is not 100% accurate."], "answer": 2, "explanation": "Bias - I [21:50-23:09] - Bias is always there; it is only a problem when it can have a negative impact."}, {"id": 3, "type": "single", "question": "Which metric is proposed in the InSaAF study to encapsulate both fairness and accuracy in the Indian legal landscape?", "options": ["Demographic Parity Score", "Perspective API Score", "Legal Grounding Score", "β-weighted Legal Safety Score"], "answer": 3, "explanation": "Bias - II [14:01-14:15] - β-weighted Legal Safety Score (LSSβ) encapsulates both fairness and accuracy of the LLM."}, {"id": 4, "type": "single", "question": "What was the primary issue with Microsoft’s chatbot “Tay”?", "options": ["It was unable to process text correctly.", "It posted unintended offensive tweets due to malicious user intent.", "It could only generate content related to the United States.", "It was too slow to respond to users."], "answer": 1, "explanation": "Bias - II [17:46-19:30] - See https://www.theverge.com/2016/3/24/11297050/tay-microsoft-chatbot-racist"}, {"id": 5, "type": "single", "question": "Analysis of AI-generated images from Midjourney showed which of the following biases regarding specialized roles?", "options": ["Only younger women were shown in specialized roles.", "Only older men were shown in specialized roles.", "Older women were frequently depicted as news analysts.", "Specialized roles always featured diverse racial representation."], "answer": 1, "explanation": "Bias - II [21:35-23:40] - For specialised roles both younger and older people were shown, but the older people were always men. (Closest option chosen; answer inferred.)"}, {"id": 6, "type": "multiple", "question": "According to “The Source of Bias” ML pipeline, at which stage can bias be introduced? (Select all that apply.)", "options": ["Collecting and labelling data", "Training using chosen metrics and objectives", "Models deployed in production", "Users see an effect"], "answer": [0, 1, 2, 3], "explanation": "Source of Bias [0:15-2:28] - Each stage of the pipeline leaves an opening for bias."}, {"id": 7, "type": "single", "question": "What does each pair in the CrowS-Pairs dataset consist of?", "options": ["One stereotype sentence and one neutral sentence", "One biased sentence and one unbiased sentence", "One stereotype sentence and one opposite stereotype sentence", "One stereotype sentence and one less stereotype sentence"], "answer": 3, "explanation": "Bias - I [25:14-28:50] - For each example, the two sentences are minimally distant: one more stereotyping, one less stereotyping. (Answer inferred.)"}, {"id": 8, "type": "single", "question": "Which of the following is a \"latent\" design choice that can lead to bias in a dataset?", "options": ["Choosing to use only English-language phrases.", "Using systematic favoritism towards a specific outcome.", "Manually editing every data point to be offensive.", "Refusing to use any AI models in production."], "answer": 0, "explanation": "A latent design choice is an unstated decision that implicitly introduces bias. Using only English implicitly excludes non-Western data."}, {"id": 9, "type": "multiple", "question": "Which of the following is the correct setting for contrastive learning? (Select all that apply.)", "options": ["Irrespective of the sentences, minimise the distance between their embeddings.", "Irrespective of the sentences, maximise the distance between their embeddings.", "If sentences are similar, minimise the distance between their embeddings.", "If sentences are different, minimise the distance between their embeddings.", "If sentences are different, maximise the distance between their embeddings.", "If sentences are different, minimise the distance between their embeddings"], "answer": [2, 4], "explanation": "Contrastive learning pulls similar items together and pushes dissimilar items apart."}, {"id": 10, "type": "single", "question": "What is a “stereotype”?", "options": ["A factual statement that applies to all humans.", "A scientifically proven characteristic.", "A legal rule used to govern a society.", "A widely held belief about some group."], "answer": 3, "explanation": "Bias - I [19:47-21:48] - Stereotype: a widely held belief about some group/entity."}, {"id": 11, "type": "single", "question": "A sentiment-analysis model is trained to predict whether book reviews are positive or negative based on user submissions. Most training reviews reflect extreme opinions, because people were less likely to submit a review if they did not respond strongly. As a result, the model is less able to predict the sentiment of subtle reviews. Which type of bias is this?", "options": ["Reporting bias", "Historical bias", "Automation bias", "In-group bias"], "answer": 0, "explanation": "See https://developers.google.com/machine-learning/crash-course/fairness/types-of-bias"}, {"id": 12, "type": "multiple", "question": "As per the lecture, which of the following is a/are a category of bias? (Select all that apply.)", "options": ["Gender", "Race", "Scientific Facts", "Profession", "Currency exchange rates"], "answer": [0, 1, 3], "explanation": "Bias - I [23:10-25:13] - Gender, race and profession are categories of bias."}]}, "5": {"week": 5, "title": "Bias II", "questions": [{"id": 1, "type": "single", "question": "What should be the language modelling score (lms) for an ideal model in the StereoSet benchmark?", "options": ["25", "50", "75", "100"], "answer": 3, "explanation": "Bias - III [7:24-11:17] - The lms of an ideal language model is 100."}, {"id": 2, "type": "single", "question": "In the CrowS-Pairs benchmark, what does a score of 100% indicate?", "options": ["The model has no social bias.", "The model always prefers anti-stereotypical sentences.", "The model always prefers stereotypical sentences.", "The model is an ideal language model."], "answer": 2, "explanation": "Bias - III [7:24-11:17] - Stereotype score (ss) is the percentage of examples where the model prefers stereotypical over anti-stereotypical associations."}, {"id": 3, "type": "single", "question": "What phenomenon occurs when fine-tuning all parameters of a large language model (LLM) to remove bias, leading to a drop in general performance?", "options": ["Model Drifting", "Catastrophic Forgetting", "Overfitting", "Gradient Explosion"], "answer": 1, "explanation": "Catastrophic forgetting occurs when fine-tuning on a specific task causes the model to lose previously learned knowledge and general capabilities."}, {"id": 4, "type": "single", "question": "What is Counterfactual Data Augmentation (CDA)?", "options": ["Re-balancing a corpus by swapping bias attribute words in a dataset.", "Adding more stereotypical sentences to a dataset to make it more biased.", "Removing all bias-attributed words in a dataset.", "Ensuring the dataset has an equal number of biased and unbiased samples."], "answer": 0, "explanation": "Bias - IV [35:49-37:57] - CDA re-balances a corpus by swapping bias attribute words (e.g. he/she)."}, {"id": 5, "type": "single", "question": "Which toolkit is used to add programmable guardrails to LLM-based conversational applications to control outputs?", "options": ["GPT-4", "NVIDIA NeMo", "CoDi", "MAFIA"], "answer": 1, "explanation": "Bias - IV [13:16-15:50] - NVIDIA NeMo is an open-source toolkit for adding programmable guardrails."}, {"id": 6, "type": "single", "question": "Match the following examples to the correct prompt variation. (i) “The image shows a subject with the occupation ‘Chief Executive Officer’. Based on the image and this information, what is the gender of the person? (a) male (b) female (c) no preference” (ii) “Looking at this image alone, who would you hire to be the CEO of a Fortune 500 company? (a) person in the image (b) someone else (c) no preference”", "options": ["i -> Informed, ii -> Informed", "i -> Informed, ii -> Blind", "i -> Blind, ii -> Informed", "i -> Blind, ii -> Blind"], "answer": 1, "explanation": "Bias in VLM's [15:05-19:02] - (i) contains details about the image and explicitly asks the gender (Informed); (ii) gives no extra information (Blind)."}, {"id": 7, "type": "multiple", "question": "The CrowS-Pairs benchmark includes which of the following types of social bias? (Select all that apply.)", "options": ["Sexual orientation", "Socioeconomic status", "Political ideology", "Physical appearance"], "answer": [0, 1, 3], "explanation": "Bias III [14:50-15:40] - Sexual orientation, socioeconomic status and physical appearance are included."}, {"id": 8, "type": "multiple", "question": "Which of the following datasets are specifically designed for measuring gender-related biases? (Select all that apply.)", "options": ["BOLD", "RedditBias", "WinoBias", "Winogender"], "answer": [2, 3], "explanation": "Bias - III [33:14-36:50] and Bias - IV [0:00-4:24] - Winogender and WinoBias both measure gender-related bias."}, {"id": 9, "type": "numeric", "question": "You are performing a bias audit on a corpus with N = 1000 total documents. Calculate the PMI between an identity label w_i and a specific descriptive word w_j. The identity label appears in 100 documents. The descriptive word appears in 50 documents. Both words co-occur in the same document 20 times.", "answer": 2, "explanation": "PMI(wi, wj) = log2( N·c(wi,wj) / (c(wi)·c(wj)) ) = log2( 1000×20 / (100×50) ) = log2(4) = 2."}, {"id": 10, "type": "single", "question": "What is the minimum threshold a word has to appear in the corpus for it to be considered when performing word association analysis?", "options": ["2 times", "5 times", "10 times", "20 times"], "answer": 2, "explanation": "Bias Handon Part 1 [5:44-7:08] - Terms that occur less than 10 times in the corpus should not be considered."}, {"id": 11, "type": "single", "question": "What is the \"Gender-bleached\" input method used for?", "options": ["To remove all images containing humans from the training set.", "To study societal bias in generated output by providing input that blurs gender.", "To increase the \"Neutral\" accuracy above the random baseline.", "To ensure the model can only identify objects rather than social attributes."], "answer": 1, "explanation": "Bias in VLM’s [8:41-9:08] - Gender-bleached input is used to study gender bias in generated output."}, {"id": 12, "type": "single", "question": "What is the main goal of the COBIAS framework when assessing bias?", "options": ["To automatically remove all stereotypical words from a model's training data.", "To increase the speed at which a model generates text by reducing the number of words used.", "To ensure that models only use gender-neutral pronouns like \"they\" in every conversation.", "To evaluate how much a model relies on specific contexts before deciding if a statement is truly biased."], "answer": 3, "explanation": "Bias - IV [17:39-18:46] - COBIAS considers the diverse situations in which inputs may arise."}]}, "6": {"week": 6, "title": "Data Privacy", "questions": [{"id": 1, "type": "multiple", "question": "According to the lecture, why would standard cryptographic solutions be unsuitable for AI model privacy? (Select all that apply.)", "options": ["It is unclear whether all complex functions can be effectively evaluated from in the encryption space.", "Evaluation in encrypted space is computationally expensive.", "As the model scales, cryptographic keys become impossible to manage.", "Encryption models cannot be used for binary classification tasks."], "answer": [0, 1], "explanation": "Data Privacy [4:06-6:22] - It is unclear whether inference can be done in encrypted space, and encryption is expensive."}, {"id": 2, "type": "single", "question": "In the context of healthcare data, why might a trained binary classification model still pose a privacy risk even if the raw data is not directly released?", "options": ["The model weights occupy too much storage space.", "Binary classifiers are inherently less secure than multi-class ones.", "An adversary can reverse-engineer sensitive training data.", "The labels used for training are usually public knowledge."], "answer": 2, "explanation": "Data Privacy [1:45-4:06] - An adversary can reverse-engineer sensitive personal information given even a simple binary classification model."}, {"id": 3, "type": "single", "question": "How were users able to deanonymize the “anonymized” Netflix dataset?", "options": ["By obtaining the meta-data of the dataset.", "By brute-forcing the sparse matrix to reveal the missing entries.", "By using cryptanalytic attacks to decode user information.", "By using an auxiliary public database, such as IMDb, to correlate ratings."], "answer": 3, "explanation": "Data Privacy [8:55-12:46] - They used an auxiliary database (IMDb) and correlated the two."}, {"id": 4, "type": "single", "question": "In the randomized response algorithm presented in the lecture, what is the minimum probability that the truthful answer is revealed?", "options": ["10%", "25%", "50%", "75%"], "answer": 2, "explanation": "Data Privacy [21:25-24:12] - ε > 0 means the truth is revealed with probability e^ε / (1 + e^ε) > 50%."}, {"id": 5, "type": "single", "question": "To maximize utility, how should the privacy parameter ε be adjusted?", "options": ["ε should be maximum for privacy, ε should be minimum for utility", "ε should be minimum for privacy, ε should be minimum for utility", "ε should be maximum for privacy, ε should be maximum for utility", "ε should be minimum for privacy, ε should be maximum for utility", "ε is unrelated"], "answer": 3, "explanation": "Data Privacy [1:00:00-1:01:20] - If ε is large, x_i and z_i are easier to distinguish, which increases utility. ε controls the privacy-utility tradeoff."}, {"id": 6, "type": "numeric", "question": "An organization surveys 100 people and asks whether they voted for a certain party. To protect privacy, it uses randomized response with ε = 0.5. Out of 100 respondents, 60 reported “Yes” and 40 reported “No.” Estimate the true number of people whose actual answer was “Yes”. Round to the nearest whole number.", "answer": 91, "explanation": "p = e^0.5/(1+e^0.5) = 0.6225. Observed y = 0.60 = x·p + (1−x)(1−p), so x = (y + p − 1)/(2p − 1) = 0.2225/0.2450 = 0.9083. Estimated Yes = 100 × 0.9083 ≈ 91."}, {"id": 7, "type": "single", "question": "Which trust scenario correctly describes the differential privacy model?", "options": ["Trust the curator; Trust the world", "Do not trust the curator; Trust the world", "Trust the curator; Do not trust the world", "Do not trust the curator; Do not trust the world"], "answer": 2, "explanation": "Data Privacy [1:06:06-1:11:00] - Surveyors trust the curator but want their information privatized when the computed function is released to the world."}, {"id": 8, "type": "single", "question": "In the Laplace Mechanism, how is the sensitivity (Δ) defined for a function f?", "options": ["The average difference between f(X) and f(X') for all neighbouring X and X'.", "The maximum absolute difference between f(X) and f(X') for any two neighboring X and X'.", "The standard deviation of the function f.", "The minimum difference between f(X) and f(X') for any two neighboring X and X'."], "answer": 1, "explanation": "Differential Privacy [21:30-22:34] - Sensitivity is the maximum |f(X) − f(X')| over neighboring datasets differing by one element."}, {"id": 9, "type": "single", "question": "According to Cynthia Dwork's definition of ε-differential privacy, for all neighbouring datasets X and X', the ratio Pr(M(X) ∈ S) / Pr(M(X') ∈ S) is at most:", "options": ["e^ε", "ε", "1/ε", "ε^e"], "answer": 0, "explanation": "Differential Privacy [9:57-15:02] - M is ε-differentially private if Pr(M(X) ∈ S) / Pr(M(X') ∈ S) ≤ e^ε."}, {"id": 10, "type": "single", "question": "What property of neighboring data sets X and X' is used to prove the privacy guarantee of Randomized Response?", "options": ["They have zero correlation.", "They differ by 99% of the elements in the set.", "They are disjoint sets.", "They differ by only one element."], "answer": 3, "explanation": "Data Privacy [24:29-25:58] - X and X' are equal for all i in {1..(n−1)}, differing only in element n."}, {"id": 11, "type": "single", "question": "For a fixed ε, if a function being computed is highly sensitive (large Δ), how does it affect the noise added to the Laplace mechanism?", "options": ["Less noise is added.", "More noise is added.", "The noise remains unchanged.", "Noise is irrelevant."], "answer": 1, "explanation": "Differential Privacy [27:14-31:00] - The more sensitive the function, the more noise should be added."}, {"id": 12, "type": "single", "question": "Comparing the Laplace mechanism and randomized response, how does the required number of respondents n differ to achieve the same privacy–utility trade-off?", "options": ["The Laplace mechanism requires quadratically more people.", "The Laplace mechanism requires quadratically fewer people.", "Both require the same number of people.", "The number of people to survey does not matter."], "answer": 1, "explanation": "Differential Privacy [50:18-53:02] - If you trust the curator, you survey quadratically fewer people with the Laplace mechanism."}]}, "7": {"week": 7, "title": "Differential Privacy & Fairness", "questions": [{"id": 1, "type": "single", "question": "In Approximate Differential Privacy, what does δ represent?", "options": ["The strict upper bound of the probability of the mechanism M.", "The estimated noise added to the Laplace Mechanism.", "The average difference between all the data points in the datasets X and X'.", "A leeway for small-probability events where ε-differential privacy may fail."], "answer": 3, "explanation": "Approximate Differential Privacy [6:50-9:26] - δ is a small leeway for low probability events where the ε-differential privacy property may not hold."}, {"id": 2, "type": "single", "question": "Compared to the Laplacian mechanism, how does the Gaussian mechanism scale the amount of noise added when releasing D different outputs?", "options": ["It adds noise linearly proportional to D.", "It adds noise proportional to the square root of D.", "It adds noise exponentially proportional to D.", "It adds the same amount of noise."], "answer": 1, "explanation": "Approximate Differential Privacy [18:00-20:58] - The Gaussian mechanism requires quadratically less noise in terms of the number of outputs released (noise grows with √D)."}, {"id": 3, "type": "multiple", "question": "Which of the following are properties of Approximate Differential Privacy? (Select all that apply.)", "options": ["It satisfies post-processing: any data-independent computation applied to the output will not make it less (ε, δ)-differentially private.", "It guarantees privacy even when δ is significantly larger than 1/n (where n is the number of individuals in a dataset).", "It satisfies composition: if you have k mechanisms that are all (ε, δ)-differentially private, then the combined mechanism is (kε, kδ)-differentially private.", "It guarantees that the output distributions of the algorithm are completely identical for any two neighboring datasets."], "answer": [0, 2], "explanation": "Approximate Differential Privacy [23:40-34:53] - It has two properties: post-processing and composition."}, {"id": 4, "type": "single", "question": "According to the lecture, what is the primary advantage of using the Gaussian Mechanism?", "options": ["Zero chance of privacy leakage.", "Faster computational time for calculating probabilities.", "Better utility due to adding quadratically less noise.", "Eliminates the need for a trusted curator."], "answer": 2, "explanation": "Approximate Differential Privacy [14:45-22:55] - The Gaussian mechanism gains better utility with quadratically less noise."}, {"id": 5, "type": "numeric", "question": "There are three buyers whose valuations are 15, 20, and 135, respectively. What is the absolute difference in revenue when the price of a digital good changes from 14 to 18? (Round your answer to the nearest whole number.)", "answer": 6, "explanation": "At price 14, all 3 buyers pay: revenue = 3×14 = 42. At price 18, two buyers (20 and 135) pay: revenue = 2×18 = 36. |42 − 36| = 6."}, {"id": 6, "type": "single", "question": "How does the Exponential Mechanism select a price h ∈ H?", "options": ["With probability proportional to the inverse of the price.", "With probability proportional to e^((ε/2δ)·S(x,h)).", "With probability proportional to e^((δ/2ε)·S(x,h)).", "Uniformly at random from all prices below the maximum valuation."], "answer": 1, "explanation": "Exponential Mechanism [14:11-15:00] - Select h ∈ H with probability proportional to e^((ε/2δ)·S(x,h))."}, {"id": 7, "type": "single", "question": "What privacy guarantee does the Exponential Mechanism provide for buyers' valuations?", "options": ["(ε, δ)-Differential Privacy", "ε-Differential Privacy", "K-Anonymity", "Concentrated Differential Privacy"], "answer": 1, "explanation": "Exponential Mechanism [15:53-18:15] - The exponential mechanism is ε-differentially private for the given valuations."}, {"id": 8, "type": "single", "question": "What is the utility guarantee provided by the Exponential Mechanism?", "options": ["It guarantees the absolute highest possible revenue every time.", "It does not guarantee positive revenue every time.", "It guarantees that the revenue will not be significantly lower than the optimal revenue.", "The guarantee will exactly match the median valuation."], "answer": 2, "explanation": "Exponential Mechanism [18:15-22:35] - Revenue will not be significantly lower than the optimal revenue."}, {"id": 9, "type": "single", "question": "In Statistical Parity, for a protected group C and a classifier M, what is the parity value for an ideal classifier?", "options": ["-1", "0", "0.5", "1"], "answer": 1, "explanation": "Fairness in Machine Learning [47:03-50:41] - An ideal classifier has parity equal to 0."}, {"id": 10, "type": "multiple", "question": "According to the data comparing White and African American defendants in risk assessments, which of the following statements are true? (Select all that apply.)", "options": ["White defendants were labeled lower risk yet did re-offend at a higher rate than African American defendants.", "African American defendants were labeled higher risk but didn't re-offend at a higher rate than White defendants.", "White defendants had a higher rate of being labeled higher risk without re-offending than African American defendants.", "African American defendants had a lower rate of being labeled lower risk yet re-offending compared to White defendants."], "answer": [0, 1, 3], "explanation": "Fairness in Machine Learning [19:42-21:38] - A higher percentage of African Americans were labelled higher risk but didn’t re-offend; a higher percentage of White people were labelled low risk but did re-offend."}, {"id": 11, "type": "single", "question": "Based on the analysis of biases in word embeddings from Wikipedia and Social Media, which of the following professions was associated with sexist prejudice towards men?", "options": ["Nurse", "Teacher", "Pharmacist", "Cameraman"], "answer": 3, "explanation": "Fairness in Machine Learning [24:44-28:10] - “Cameraman” is associated with sexist prejudice towards men."}, {"id": 12, "type": "single", "question": "The goal of Fair PCA is to find a PCA solution U = [U_A, U_B] such that the reconstruction losses of groups A and B (where A is the protected group) are:", "options": ["Equal", "Unequal", "The protected group has a lower reconstruction loss", "The protected group has a higher reconstruction loss"], "answer": 0, "explanation": "Fairness in Machine Learning [40:05-44:56] - At optimality, Fair PCA minimizes the maximum loss between groups, forcing their average reconstruction errors to be equal."}]}, "8": {"week": 8, "title": "Interpretability", "questions": [{"id": 1, "type": "single", "question": "Which of the following best describes Pixel Attribution Methods?", "options": ["They compress neural network layers to reduce model size.", "They automatically remove backdoor triggers from poisoned datasets.", "They convert text datasets directly into image representations.", "They highlight pixels that were relevant for a certain image classification."], "answer": 3, "explanation": "Interpretability - I [3:40-4:55] - Pixel attribution methods highlight the pixels that were relevant for a certain image classification by a neural network."}, {"id": 2, "type": "single", "question": "Which of the following pixel attribution methods involve manipulating parts of an image to generate explanations?", "options": ["Gradient-based methods", "Occlusion-based methods", "Mechanical methods", "Top-down methods"], "answer": 1, "explanation": "Interpretability - I [6:33-7:25] - Occlusion/perturbation-based methods like SHAP and LIME manipulate parts of the image (model-agnostic)."}, {"id": 3, "type": "single", "question": "What should happen to a saliency map if a model that genuinely captures higher-level class concepts has its layers randomized?", "options": ["The map should invert its colors.", "The map should remain identical.", "The map should change significantly.", "The map should become a blank image."], "answer": 2, "explanation": "Interpretability - I [20:11-22:28] - If a model captures higher-level class concepts, saliency maps should change as the model is randomized."}, {"id": 4, "type": "multiple", "question": "How can we validate the explanations given by LIME? (Select all that apply.)", "options": ["By using prior knowledge.", "By randomizing the model’s layers.", "By using human annotators.", "By applying adversarial perturbations."], "answer": [0, 2], "explanation": "Interpretability - I [25:10-27:03] - Prior knowledge can validate explanations, and human annotation can decide whether the explanations are correct."}, {"id": 5, "type": "single", "question": "Which of the following interpretability approaches involves locating information in a model without fully understanding how it is processed?", "options": ["Mechanistic interpretability", "Top-down interpretability", "Feature-based visualization", "Game-theoretic approach"], "answer": 1, "explanation": "Interpretability - II [9:57-11:58] - Top-down locates information in a model without full understanding of how it is processed."}, {"id": 6, "type": "single", "question": "What is the primary function of probing in interpretability?", "options": ["To inject hidden trojans into public datasets during training.", "To check whether representations encode information reliably", "To optimize latent space interpolation for image generation", "To completely reverse-engineer all node-to-node algorithmic connections in large language models."], "answer": 1, "explanation": "Interpretability - II [13:57-16:33] - Probing checks whether representations encode information reliably for some specific task."}, {"id": 7, "type": "multiple", "question": "According to the lecture, which of the following are Attack Vectors? (Select all that apply.)", "options": ["API keys", "Public Datasets", "HuggingFace models", "A downloadable execution file"], "answer": [1, 2], "explanation": "Interpretability - II [20:32-21:23] - Public datasets and model sharing libraries are examples of attack vectors."}, {"id": 8, "type": "single", "question": "Consider the LIME equation ξ(x) = argmin_{g∈G} L(f, g, π_x) + Ω(g). What do the components L and Ω(g) represent?", "options": ["L measures how unfaithful the explanation model g is in approximating f locally (weighted by π_x), while Ω(g) measures the complexity/interpretability penalty of the explanation model.", "L represents the global accuracy of the black-box model f, and Ω(g) represents the total number of convolutional layers.", "L is the adversarial perturbation budget, and Ω(g) is the learning rate of the surrogate model.", "L calculates the exact Shapley values, and Ω(g) computes the gradient with respect to input pixels."], "answer": 0, "explanation": "Interpretability - I [32:03-34:57] - L quantifies how poorly the simple model g approximates the black-box f in the local neighborhood π_x; Ω(g) penalizes complexity so the explanation stays interpretable."}, {"id": 9, "type": "single", "question": "What is the primary goal of Neural Cleanse when detecting Trojans in neural networks?", "options": ["To fine-tune the model using a 0.05% poisoned dataset", "To reverse-engineer potential triggers", "To prune the entire first-layer weights of a classifier", "To train a neural network using high-dimensional pooling layers"], "answer": 1, "explanation": "Interpretability - II [26:57-31:36] - If we know the general form of the attack, we can reverse-engineer the Trojan by searching for a trigger and target label."}, {"id": 10, "type": "single", "question": "How does top-down interpretability differ from mechanistic interpretability?", "options": ["Top-down focuses on algorithmic node-to-node connections, whereas mechanistic looks at global activity of populations of neurons.", "Top-down localizes information in a model and looks at representational spaces, while mechanistic attempts to reverse-engineer neural networks at the neuron level.", "Top-down requires full mathematical proof of model weights, whereas mechanistic is entirely model-agnostic.", "Top-down can only be applied to text-based saliency maps, whereas mechanistic only applies to GANs."], "answer": 1, "explanation": "Interpretability - II [6:27-11:58] - Mechanistic: reverse-engineer neural networks. Top-down: locate information without full understanding of how it is processed."}, {"id": 11, "type": "single", "question": "What game-theoretic concept does SHAP (Shapley Additive exPlanations) use to explain the output of any machine learning model?", "options": ["Nash Equilibrium", "Pareto Optimality", "Shapley Values", "Minimax Theorem"], "answer": 2, "explanation": "Interpretability - I [35:20-39:39] - SHAP connects optimal credit allocation with local explanations using the classic Shapley values from game theory."}, {"id": 12, "type": "multiple", "question": "Regarding LIME and SHAP, which of the following statements are true? (Select all that apply.)", "options": ["They generate global explanations that apply uniformly across the entire dataset.", "They are model-agnostic methods that can work on any black-box model.", "They are restricted solely to image datasets and cannot handle natural language data.", "They can be computationally expensive to compute compared to direct gradient-based visualizations."], "answer": [1, 3], "explanation": "Interpretability - I [25:09-39:39] - They work on any black-box model with many data types."}]}, "9": {"week": 9, "title": "AI Policy & Regulation", "questions": [{"id": 1, "type": "single", "question": "What is the difference between \"vertical\" and \"horizontal\" AI regulation?", "options": ["Vertical regulates the hardware, while horizontal regulates the software.", "Vertical regulation is completely market-based, while horizontal is purely state-controlled.", "Vertical regulation applies existing sector-specific laws to AI, while horizontal regulation creates broad, new risk-based laws across all sectors.", "Vertical regulation only applies to the industry, while horizontal applies to the industry and its customers."], "answer": 2, "explanation": "AI Policies, Regulations, AGI - Part 1 [40:25-43:12] - Vertical regulation tweaks existing laws for specific industries; horizontal regulation classifies and governs the technology across all sectors."}, {"id": 2, "type": "single", "question": "Why is data privacy considered a relatively better-understood guardrail compared to model explainability?", "options": ["Explainability has exact mathematical bounds, whereas privacy cannot be measured mathematically.", "Privacy can be controlled by improving the model’s accuracy, while explainability depends mainly on the const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const ERR_KEY = 'rai_errors', THEME_KEY = 'rai_theme';

let Q = [], idx = 0, score = 0, week = 1;

function initQuiz(jumpToIdx) {
  week = parseInt($('week-selector').value, 10);
  Q = (DATA[week] && DATA[week].questions) || [];
  idx = typeof jumpToIdx === 'number' ? jumpToIdx : 0;
  score = 0;
  renderQuestion();
  updateUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function answerList(q) { return Array.isArray(q.answer) ? q.answer : [q.answer]; }
function correctText(q) {
  return q.type === 'numeric' ? String(q.answer) : answerList(q).map(i => q.options[i]).join(' | ');
}

function renderQuestion() {
  const box = $('quiz-container');
  const q = Q[idx];
  if (!Q.length) {
    box.innerHTML = '<p style="text-align:center">No questions for this week.</p>';
    $('controls').style.display = 'none';
    return;
  }
  if (!q) {
    box.innerHTML = `<div style="text-align:center"><h2>Assignment Complete!</h2><p>Your Score: ${score}/${Q.length}</p><button class="btn btn-submit" onclick="initQuiz()">Restart</button></div>`;
    $('controls').style.display = 'none';
    return;
  }
  $('controls').style.display = 'block';
  $('next-btn').style.display = 'none';
  $('submit-btn').style.display = 'block';
  $('submit-btn').disabled = true;

  let html = `<div class="q-text">Q${idx + 1}: ${esc(q.question)}</div>`;
  if (q.type === 'numeric') {
    html += `<div class="q-hint">Enter a number (rounded to nearest whole number)</div>
             <input type="number" step="any" id="num-input" class="num-input" placeholder="Your answer" oninput="onPick()">`;
  } else {
    const multi = q.type === 'multiple';
    html += `<div class="q-hint">${multi ? 'Select all that apply' : 'Select one'}</div>`;
    q.options.forEach((opt, i) => {
      html += `<label class="option-label" id="opt-label-${i}">
        <input type="${multi ? 'checkbox' : 'radio'}" name="quiz-opt" value="${i}" onchange="onPick()">
        <span>${esc(opt)}</span></label>`;
    });
  }
  html += '<div id="feedback" class="feedback-area"></div>';
  box.innerHTML = html;
}

function onPick() {
  const q = Q[idx];
  if (q.type === 'numeric') {
    $('submit-btn').disabled = $('num-input').value.trim() === '';
    return;
  }
  let any = false;
  document.querySelectorAll('input[name="quiz-opt"]').forEach(el => {
    el.parentElement.classList.toggle('selected', el.checked);
    if (el.checked) any = true;
  });
  $('submit-btn').disabled = !any;
}

function checkAnswer() {
  const q = Q[idx];
  let isCorrect, mine;
  if (q.type === 'numeric') {
    mine = $('num-input').value.trim();
    isCorrect = Math.round(parseFloat(mine)) === q.answer;
    $('num-input').disabled = true;
  } else {
    const picked = [...document.querySelectorAll('input[name="quiz-opt"]:checked')].map(e => +e.value).sort((a, b) => a - b);
    const right = answerList(q).slice().sort((a, b) => a - b);
    isCorrect = picked.length === right.length && picked.every((v, i) => v === right[i]);
    mine = picked.map(i => q.options[i]).join(' | ');
    document.querySelectorAll('input[name="quiz-opt"]').forEach(el => {
      el.disabled = true;
      const lbl = el.parentElement, i = +el.value;
      if (right.includes(i)) lbl.classList.add('right');
      else if (el.checked) lbl.classList.add('wrong');
    });
  }

  const fb = $('feedback');
  fb.style.display = 'block';
  $('submit-btn').style.display = 'none';
  $('next-btn').style.display = 'block';

  if (isCorrect) {
    score++;
    fb.className = 'feedback-area feedback-correct';
    fb.innerHTML = '<strong style="color:var(--success)">Correct!</strong>';
    removeFromErrorLog(week, q.id);
  } else {
    fb.className = 'feedback-area feedback-wrong';
    fb.innerHTML = `<strong style="color:var(--danger)">Incorrect.</strong> Correct answer: ${esc(correctText(q))}`;
    saveToErrorLog({ week, id: q.id, idx, q: q.question, a: correctText(q), wrong: mine });
  }
  fb.innerHTML += `<div class="description-box">${esc(q.explanation || '')}</div>`;
  updateUI();
}

function nextQuestion() { idx++; renderQuestion(); updateUI(); }

function updateUI() {
  $('current-score').textContent = `${score} / ${Q.length}`;
  $('q-count').textContent = `${Math.min(idx + 1, Q.length)} / ${Q.length}`;
  $('progress-bar').style.width = (Q.length ? Math.min(idx, Q.length) / Q.length * 100 : 0) + '%';
}

/* ---- Error log ---- */
function getLogs() { try { return JSON.parse(store.get(ERR_KEY) || '[]'); } catch(e) { return []; } }
function saveToErrorLog(entry) {
  const logs = getLogs();
  if (!logs.some(l => l.week === entry.week && l.id === entry.id)) {
    logs.push(entry);
    store.set(ERR_KEY, JSON.stringify(logs));
  }
  renderLogs();
}
function removeFromErrorLog(w, id) {
  store.set(ERR_KEY, JSON.stringify(getLogs().filter(l => !(l.week === w && l.id === id))));
  renderLogs();
}
function renderLogs() {
  const logs = getLogs();
  const c = $('wrong-log');
  if (!logs.length) { c.innerHTML = '<p style="font-size:12px;opacity:.5;text-align:center">No mistakes yet!</p>'; return; }
  c.innerHTML = logs.slice().reverse().map(l => `
    <div class="log-card" onclick="toggleLog(this)">
      <span class="jump" onclick="jumpTo(event, ${l.week}, ${l.idx})">W${l.week} · JUMP</span>
      <strong>Q:</strong> ${esc(l.q)}
      <div class="log-details">
        <p style="color:var(--danger)">Wrong: ${esc(l.wrong)}</p>
        <p style="color:var(--success)">Correct: ${esc(l.a)}</p>
      </div>
    </div>`).join('');
}
function toggleLog(card) {
  const d = card.querySelector('.log-details');
  d.style.display = d.style.display === 'block' ? 'none' : 'block';
}
function jumpTo(ev, w, i) {
  ev.stopPropagation();
  $('week-selector').value = String(w);
  initQuiz(i);
}

/* ---- Theme / reset ---- */
function applyTheme(dark) {
  document.body.classList.toggle('dark-mode', dark);
  $('theme-btn').textContent = dark ? '☀️' : '🌙';
}
function toggleTheme() {
  const dark = !document.body.classList.contains('dark-mode');
  applyTheme(dark);
  store.set(THEME_KEY, dark ? 'dark' : 'light');
}
function clearData() {
  if (confirm('Reset all data?')) { store.del(ERR_KEY); store.del(THEME_KEY); location.reload(); }
}

window.onload = () => {
  const sel = $('week-selector');
  Object.keys(DATA).map(Number).sort((a, b) => a - b).forEach(w => {
    const o = document.createElement('option');
    o.value = w;
    o.textContent = `Week ${w}: ${DATA[w].title}`;
    sel.appendChild(o);
  });
  applyTheme((store.get(THEME_KEY) || 'dark') === 'dark');
  initQuiz();
  renderLogs();
};
</script>
</body>
</html>
